<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--midnight:#0d1117;--slate:#1e2530;--slate-mid:#2a3340;--amber:#f5a623;--stone:#8c97a3;--smoke:#d4dbe3;--white:#f0f4f8;}
  html,body{min-height:100%;background:var(--midnight);color:var(--white);font-family:'DM Sans',sans-serif;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(245,166,35,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(245,166,35,0.04) 1px,transparent 1px);background-size:64px 64px;pointer-events:none;z-index:0}
  body::after{content:'';position:fixed;top:-20%;left:50%;transform:translateX(-50%);width:800px;height:600px;background:radial-gradient(ellipse at center,rgba(245,166,35,0.08) 0%,transparent 70%);pointer-events:none;z-index:0}
  .wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 24px}
  nav{padding:20px 0;display:flex;align-items:center;justify-content:space-between}
  .logo{display:flex;align-items:center;gap:12px;text-decoration:none}
  .logo-grid{display:grid;grid-template-columns:repeat(3,12px);grid-template-rows:repeat(3,12px);gap:2px}
  .logo-grid span{display:block;border-radius:2px;background:var(--slate-mid)}
  .logo-grid span.accent{background:var(--amber)}
  .logo-name{font-size:1.1rem;font-weight:700;letter-spacing:-0.02em;color:var(--white)}
  .logo-name em{font-style:normal;color:var(--amber)}
  h1{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;letter-spacing:-0.02em;color:var(--white);margin-bottom:8px}
  .subtitle{font-size:0.9rem;color:var(--stone);margin-bottom:36px;line-height:1.6}
  .card{background:var(--slate);border:1px solid rgba(245,166,35,0.15);border-radius:16px;padding:32px;margin-bottom:20px}
  .card-title{font-size:1rem;font-weight:700;color:var(--white);margin-bottom:20px;display:flex;align-items:center;gap:10px}
  .field{margin-bottom:16px}
  label{display:block;font-size:0.8rem;font-weight:600;color:var(--stone);margin-bottom:6px;letter-spacing:0.04em;text-transform:uppercase}
  input[type=text],input[type=email],textarea{width:100%;background:var(--midnight);border:1px solid var(--slate-mid);border-radius:10px;color:var(--white);padding:12px 16px;font-size:0.95rem;font-family:'DM Sans',sans-serif;outline:none;transition:border 0.2s;resize:vertical}
  input:focus,textarea:focus{border-color:var(--amber)}
  textarea{min-height:120px}
  .btn{width:100%;padding:14px;background:var(--amber);color:var(--midnight);border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity 0.2s}
  .btn:hover{opacity:0.9}
  .btn:disabled{opacity:0.5;cursor:not-allowed}
  .error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:12px 16px;font-size:0.85rem;color:#f87171;margin-bottom:16px;display:none}
  .success-msg{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);border-radius:8px;padding:12px 16px;font-size:0.85rem;color:#34d399;margin-bottom:16px;display:none}
  .wa-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:16px;background:#25D366;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;text-decoration:none;font-family:'DM Sans',sans-serif;transition:opacity 0.2s}
  .wa-btn:hover{opacity:0.9}
  .wa-icon{width:24px;height:24px;fill:#fff}
</style>
</head>
<body>
<div class="wrap">
  <nav>

        <span></span><span></span><span></span>
        <span></span><span class="accent"></span><span></span>
        <span></span><span></span><span></span>

    <a href="https://tile-iq.com" style="font-size:0.82rem;color:var(--stone);text-decoration:none;">← Back</a>

      Open WhatsApp
    </a>
  </div>

  <!-- Email Form -->
  <div class="card">
    <div class="card-title">✉️ Send us an email</div>
    <div class="error" id="error-msg"></div>
    <div class="success-msg" id="success-msg">Message sent! We'll get back to you shortly.</div>
    <div class="field">
      <label>Your Name</label>
      <input type="text" id="name" placeholder="John Smith"/>
    </div>
    <div class="field">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="john@example.com"/>
    </div>
    <div class="field">
      <label>Message</label>
      <textarea id="message" placeholder="How can we help?"></textarea>
    </div>
    <button class="btn" id="send-btn" onclick="sendMessage()">Send Message</button>
  </div>
</div>

<script>
  const WORKER_URL = "https://tileiq-worker.kevin-woodley.workers.dev";

  async function sendMessage() {
    const name    = document.getElementById('name').value.trim();
    const email   = document.getElementById('email').value.trim();
    const message = document.getElementById('message').value.trim();
    const btn     = document.getElementById('send-btn');
    const errEl   = document.getElementById('error-msg');
    const sucEl   = document.getElementById('success-msg');

    errEl.style.display = 'none';
    sucEl.style.display = 'none';

    if (!name)    return showError('Please enter your name.');
    if (!email)   return showError('Please enter your email address.');
    if (!message) return showError('Please enter a message.');

    btn.disabled = true;
    btn.textContent = 'Sending\u2026';

    try {
      const resp = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'contact_form', name, email, message })
      });
      const data = await resp.json();
      if (!resp.ok) return showError(data.error || 'Something went wrong.');
      sucEl.style.display = 'block';
      document.getElementById('name').value = '';
      document.getElementById('email').value = '';
      document.getElementById('message').value = '';
      if (typeof gtag !== 'undefined') gtag('event', 'contact_form_submit');
    } catch(e) {
      showError('Something went wrong. Please try again.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send Message';
    }
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('send-btn').disabled = false;
    document.getElementById('send-btn').textContent = 'Send Message';
  }
</script>
