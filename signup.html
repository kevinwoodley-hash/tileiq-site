<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create your TileIQ account</title>
  <style>html,body{margin:0;width:100%;height:100%;background:#07090b;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
  <iframe id="tileiq-app" src="/app" title="Create your TileIQ account"></iframe>
  <script>
    const frame=document.getElementById('tileiq-app');
    frame.addEventListener('load',()=>{
      try{
        const w=frame.contentWindow;
        const openSignup=()=>{
          if(typeof w.show==='function'){
            w.show('screen-signup');
            if(typeof w.generateCaptcha==='function') w.generateCaptcha();
            return true;
          }
          return false;
        };
        if(!openSignup()){
          let tries=0;
          const timer=setInterval(()=>{
            tries++;
            if(openSignup()||tries>30) clearInterval(timer);
          },100);
        }
      }catch(e){
        window.location.href='/app';
      }
    });
  </script>
</body>
</html>
